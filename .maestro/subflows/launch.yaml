# Lance l'application sans session, avec la localisation et les photos autorisées.
# APP_ID = host.exp.exponent (Expo Go, EXPO_URL requis) ou com.mesbonnesadresses.app (build natif)
appId: ${APP_ID}
---
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${APP_ID == 'host.exp.exponent'}
    commands:
      - openLink: ${EXPO_URL}
      # Message d'accueil du menu développeur d'Expo Go
      - tapOn:
          text: "Continue"
          optional: true
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 30000
